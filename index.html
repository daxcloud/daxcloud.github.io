<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dax Gulje</title>
<meta name="description" content="Dax Gulje. Outbound GTM consultant, enterprise sales leader, technologist. Santa Barbara, CA.">
<meta property="og:title" content="Dax Gulje"><meta property="og:image" content="https://dax.io/assets/splash.jpg"><meta property="og:url" content="https://dax.io/">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--ink:#0C1416;--brass:#E0B368;--cream:#FCFAF3}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--ink);color:var(--cream);font-family:'IBM Plex Mono',monospace}
.bg{position:fixed;inset:0;background:url(/assets/splash.jpg) center 40%/cover no-repeat}
.bg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(12,20,22,.15) 0%,rgba(12,20,22,.05) 40%,rgba(12,20,22,.55) 100%)}
.wrap{position:relative;min-height:100%;display:grid;grid-template-rows:1fr auto;padding:clamp(20px,4vw,44px)}
.center{display:flex;align-items:start;justify-content:center;padding-top:18vh}
.gtm{font-family:'Instrument Serif',Georgia,serif;font-size:clamp(34px,6vw,72px);line-height:1;color:var(--cream);text-decoration:none;letter-spacing:.01em;text-shadow:0 2px 24px rgba(0,0,0,.45);border-bottom:1px solid transparent;transition:border-color .25s,color .25s}
.gtm:hover{color:var(--brass);border-color:var(--brass)}
.foot{display:flex;justify-content:space-between;align-items:end;gap:16px}
.pill{font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--cream);text-decoration:none;padding:12px 18px;border:1px solid rgba(252,250,243,.55);border-radius:2px;background:rgba(12,20,22,.35);backdrop-filter:blur(6px);transition:all .25s}
.pill:hover{border-color:var(--brass);color:var(--brass)}
@media (max-width:520px){.pill{padding:10px 14px;font-size:11px}}
</style></head><body>
<div class="bg" role="img" aria-label="Two boxers running down a Santa Barbara beach at dawn"></div>
<main class="wrap">
  <div class="center"><a class="gtm" href="/gtm/">GTM Consulting</a></div>
  <nav class="foot"><a class="pill" href="/cv/">CV</a><a class="pill" href="https://www.linkedin.com/in/daxter" rel="me noopener" target="_blank">LinkedIn</a></nav>
</main>
</body></html>
